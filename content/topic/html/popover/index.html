<!doctype html>
<html>
	<head>
		<title>Popover</title>
	</head>
	<body>
		<h1>Popovers (without JS)</h1>
		<button popovertarget="your-popover" popovertargetaction="show">
			Show the <code>aside</code>
		</button>
		<button popovertarget="your-popover" popovertargetaction="hide">
			Be sure to let folks hide it
		</button>
		<aside id="your-popover" popover>
			<p>Made you look!</p>
		</aside>
	</body>
</html>
